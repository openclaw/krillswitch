packages:
  - apps/*
  - packages/*

# Keep newly published dependencies out of the default resolution window.
minimumReleaseAge: 2880

nodeLinker: hoisted
blockExoticSubdeps: true

overrides:
  esbuild@<=0.24.2: 0.28.2
  uuid@<11.1.1: 11.1.1
  sharp@<0.35.4: 0.35.4
  undici@>=7.0.0 <7.29.1: 7.29.1
  undici@>=8.0.0 <8.10.2: 8.10.2

allowBuilds:
  "@prisma/client": false
  better-sqlite3: true
  esbuild: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
