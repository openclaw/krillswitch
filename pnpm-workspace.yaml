packages:
  - apps/*
  - packages/*

# Keep newly published dependencies out of the default resolution window.
minimumReleaseAge: 2880

nodeLinker: hoisted
blockExoticSubdeps: true

overrides:
  workerd: 1.20261021.1
  esbuild@<=0.24.2: 0.28.2
  uuid@<11.1.1: 11.1.1
  sharp@<0.35.5: 0.35.5
  source-map-js@<1.2.2: 1.2.2
  undici@>=7.0.0 <7.30.1: 7.30.1
  undici@>=8.0.0 <8.12.2: 8.12.3
  zod@<4.6.6: 4.6.7

allowBuilds:
  "@prisma/client": false
  better-sqlite3: true
  esbuild: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
