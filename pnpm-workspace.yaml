packages:
  - apps/*
  - packages/*

# Keep newly published dependencies out of the default resolution window.
minimumReleaseAge: 2880

nodeLinker: hoisted
blockExoticSubdeps: true

overrides:
  esbuild@<=0.24.2: 0.28.1
  uuid@<11.1.1: 11.1.1
  sharp@<0.35.0: 0.35.3

allowBuilds:
  "@prisma/client": false
  better-sqlite3: true
  esbuild: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - uuid@11.1.1
