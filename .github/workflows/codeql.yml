name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODEQL_ENABLED: ${{ vars.KRILLSWITCH_CODEQL_ENABLED || 'false' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Report CodeQL availability
        if: ${{ env.CODEQL_ENABLED != 'true' }}
        run: |
          echo "::warning::CodeQL is disabled until GitHub Code Security is licensed for this private repository and KRILLSWITCH_CODEQL_ENABLED=true is configured."

      - name: Checkout
        if: ${{ env.CODEQL_ENABLED == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        if: ${{ env.CODEQL_ENABLED == 'true' }}
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        if: ${{ env.CODEQL_ENABLED == 'true' }}
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: "/language:javascript-typescript"
