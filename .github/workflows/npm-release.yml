name: SDK npm release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and verify SDKs without publishing
        type: boolean
        default: true
      version:
        description: SDK version (blank uses current metadata)
        type: string
  push:
    tags:
      - "sdk-v*.*.*"

permissions: {}

concurrency:
  group: sdk-npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.22.1

jobs:
  prepare:
    name: Prepare SDK artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate immutable SDK release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          VERSION: ${{ inputs.version || github.ref_name }}
          CI_WORKFLOWS: ci.yml
        run: |
          if [ "$VERSION" = main ]; then VERSION="$(python3 -c 'import json; print(json.load(open("packages/core/package.json"))["version"])')"; export VERSION; fi
          python3 -B scripts/sdk-release-preflight.py
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch main
        run: git fetch --no-tags origin main

      - name: Pack and verify exact SDK artifacts
        env:
          SDK_PACK_OUTPUT_DIR: ${{ github.workspace }}/release-artifacts
        run: pnpm verify:sdk-packages

      - name: Record release metadata
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          pnpm sdk:release:prepare
          cp release-notes.md release-artifacts/
          cd release-artifacts
          sha256sum ./*.tgz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain preflight artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krillswitch-sdk-${{ github.ref_name }}
          path: |
            release-artifacts/core.tgz
            release-artifacts/react.tgz
            release-artifacts/release-metadata.json
            release-artifacts/release-notes.md
            release-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push'
    name: Publish core and React SDKs
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Fetch main
        run: git fetch --no-tags origin main

      - name: Download preflight artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: krillswitch-sdk-${{ github.ref_name }}
          path: release-artifacts

      - name: Publish and verify retained artifacts
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm install --global npm@11.20.0
          env -u NPM_TOKEN -u NODE_AUTH_TOKEN node scripts/sdk-release.mjs publish release-artifacts

  release:
    name: Publish SDK GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: krillswitch-sdk-${{ github.ref_name }}
          path: release-artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#sdk-v}"
          cd release-artifacts
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tgz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Krillswitch SDK v$version" --notes-file release-notes.md
