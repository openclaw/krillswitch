name: Deploy Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-access:
    name: Compare OpenClaw Access applications
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect Access applications and policies
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          api_token = os.environ["CLOUDFLARE_API_TOKEN"]
          targets = {
              "clawrouter.openclaw.ai",
              "punchcard.openclaw.ai",
              "switch.openclaw.ai",
          }

          def request(path):
              request = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4{path}",
                  headers={"Authorization": f"Bearer {api_token}"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  payload = json.load(error)
                  print(f"{path}: Cloudflare API returned HTTP {error.code}")
              if not payload.get("success"):
                  for error in payload.get("errors", []):
                      print(
                          f"{path}: Cloudflare error "
                          f"{error.get('code')}: {error.get('message')}"
                      )
                  raise SystemExit(f"Cloudflare lookup failed for {path}")
              return payload.get("result", [])

          def rule_summary(rule):
              if "email" in rule:
                  email = rule["email"].get("email", "").lower()
                  local, _, domain = email.partition("@")
                  digest = hashlib.sha256(email.encode()).hexdigest()[:12]
                  return {
                      "type": "email",
                      "domain": domain,
                      "local_length": len(local),
                      "sha256_12": digest,
                  }
              if "email_domain" in rule:
                  return {
                      "type": "email_domain",
                      "domain": rule["email_domain"].get("domain"),
                  }
              if "github-organization" in rule:
                  github = rule["github-organization"]
                  return {
                      "type": "github-organization",
                      "name": github.get("name"),
                      "team": github.get("team"),
                      "identity_provider_id": github.get(
                          "identity_provider_id"
                      ),
                  }
              return {"type": next(iter(rule), "unknown")}

          providers = request(
              f"/accounts/{account_id}/access/identity_providers"
          )
          print(
              "identity_providers="
              + json.dumps(
                  [
                      {
                          "id": provider.get("id"),
                          "name": provider.get("name"),
                          "type": provider.get("type"),
                      }
                      for provider in providers
                  ],
                  sort_keys=True,
              )
          )

          applications = request(
              f"/accounts/{account_id}/access/apps?per_page=100"
          )
          for app in sorted(
              (
                  app
                  for app in applications
                  if app.get("domain") in targets
              ),
              key=lambda app: app.get("domain", ""),
          ):
              app_id = app["id"]
              policies = request(
                  f"/accounts/{account_id}/access/apps/"
                  f"{urllib.parse.quote(app_id)}/policies?per_page=100"
              )
              summary = {
                  "name": app.get("name"),
                  "domain": app.get("domain"),
                  "type": app.get("type"),
                  "session_duration": app.get("session_duration"),
                  "auto_redirect_to_identity": app.get(
                      "auto_redirect_to_identity"
                  ),
                  "allowed_idps": app.get("allowed_idps", []),
                  "destinations": app.get("destinations", []),
                  "policies": [
                      {
                          "name": policy.get("name"),
                          "decision": policy.get("decision"),
                          "precedence": policy.get("precedence"),
                          "include": [
                              rule_summary(rule)
                              for rule in policy.get("include", [])
                          ],
                      }
                      for policy in policies
                  ],
              }
              print(json.dumps(summary, sort_keys=True))
          PY
