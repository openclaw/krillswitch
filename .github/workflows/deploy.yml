name: Deploy Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal-punchcard-secrets:
    name: Seal Punchcard Cloudflare secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUNCHCARD_ACTIONS_KEY_ID: "3380204578043523366"
      PUNCHCARD_ACTIONS_PUBLIC_KEY: "xtzzMv6ts1MPNfPUaziF4cXtbbD9sb54AX4DRni22xg="
    steps:
      - name: Validate source secrets
        shell: bash
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing source secret: ${name}"
              exit 1
            fi
          done

      - name: Seal for Punchcard
        shell: bash
        run: |
          if ! ldconfig -p | grep -q libsodium; then
            sudo apt-get update
            sudo apt-get install --yes libsodium23
          fi

          python3 <<'PY'
          import base64
          import ctypes
          import ctypes.util
          import json
          import os

          public_key = base64.b64decode(
              os.environ["PUNCHCARD_ACTIONS_PUBLIC_KEY"],
              validate=True,
          )
          if len(public_key) != 32:
              raise SystemExit("invalid Punchcard Actions public key")

          library_path = ctypes.util.find_library("sodium")
          if not library_path:
              raise SystemExit("libsodium is unavailable")

          sodium = ctypes.cdll.LoadLibrary(library_path)
          sodium.sodium_init.restype = ctypes.c_int
          sodium.crypto_box_seal.argtypes = [
              ctypes.POINTER(ctypes.c_ubyte),
              ctypes.POINTER(ctypes.c_ubyte),
              ctypes.c_ulonglong,
              ctypes.POINTER(ctypes.c_ubyte),
          ]
          sodium.crypto_box_seal.restype = ctypes.c_int

          if sodium.sodium_init() < 0:
              raise SystemExit("libsodium initialization failed")

          public_key_buffer = (ctypes.c_ubyte * len(public_key)).from_buffer_copy(
              public_key,
          )
          sealed = {}

          for name in ("CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN"):
              plaintext = os.environ[name].encode()
              plaintext_buffer = (
                  ctypes.c_ubyte * len(plaintext)
              ).from_buffer_copy(plaintext)
              ciphertext_buffer = (
                  ctypes.c_ubyte * (len(plaintext) + 48)
              )()
              result = sodium.crypto_box_seal(
                  ciphertext_buffer,
                  plaintext_buffer,
                  len(plaintext),
                  public_key_buffer,
              )
              if result != 0:
                  raise SystemExit(f"failed to seal {name}")
              sealed[name] = base64.b64encode(bytes(ciphertext_buffer)).decode()

          payload = {
              "key_id": os.environ["PUNCHCARD_ACTIONS_KEY_ID"],
              "secrets": sealed,
          }
          encoded = base64.b64encode(
              json.dumps(payload, separators=(",", ":")).encode(),
          ).decode()
          print(f"PUNCHCARD_SEALED_PAYLOAD={encoded}")
          PY
