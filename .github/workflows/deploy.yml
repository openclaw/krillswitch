name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Production component to deploy"
        required: false
        default: public
        type: choice
        options:
          - public
          - admin

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy-public:
    if: ${{ github.ref == 'refs/heads/main' && inputs.target == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Apply D1 migrations and deploy public Worker
        run: pnpm deploy:public
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    if: ${{ github.ref == 'refs/heads/main' && inputs.target == 'admin' }}
    runs-on: ubuntu-24.04
    environment: krillswitch-admin
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Verify production build
        run: pnpm --dir apps/admin build

      - name: Apply D1 migrations and deploy Worker
        run: pnpm --dir apps/api db:migrate:remote && pnpm --dir apps/api deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove legacy Cloudflare Access gate
        if: ${{ vars.KRILLSWITCH_ACCESS_APP_ID != '' }}
        run: pnpm cf:access:remove
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KRILLSWITCH_ACCESS_APP_ID: ${{ vars.KRILLSWITCH_ACCESS_APP_ID }}
