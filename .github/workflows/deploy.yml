name: Deploy Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-punchcard-domains:
    name: Diagnose Punchcard Worker domains
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect Worker custom domains
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import socket
          import urllib.error
          import urllib.request

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          api_token = os.environ["CLOUDFLARE_API_TOKEN"]
          targets = {
              "api.punchcard.openclaw.ai",
              "punchcard.openclaw.ai",
          }

          request = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/domains",
              headers={"Authorization": f"Bearer {api_token}"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              payload = json.load(error)
              print(f"Cloudflare API returned HTTP {error.code}")

          if not payload.get("success"):
              for error in payload.get("errors", []):
                  print(f"Cloudflare error {error.get('code')}: {error.get('message')}")
              raise SystemExit("Cloudflare domain lookup failed")

          domains = {
              domain["hostname"]: domain
              for domain in payload.get("result", [])
              if domain.get("hostname") in targets
          }
          for hostname in sorted(targets):
              domain = domains.get(hostname)
              if domain:
                  print(
                      f"{hostname}: configured "
                      f"service={domain.get('service')} "
                      f"environment={domain.get('environment')} "
                      f"zone={domain.get('zone_name')}"
                  )
              else:
                  print(f"{hostname}: absent from Worker custom domains")

              try:
                  addresses = sorted(
                      {
                          address[4][0]
                          for address in socket.getaddrinfo(
                              hostname,
                              443,
                              type=socket.SOCK_STREAM,
                          )
                      }
                  )
              except socket.gaierror as error:
                  print(f"{hostname}: DNS unresolved ({error})")
              else:
                  print(f"{hostname}: DNS {','.join(addresses)}")
          PY
