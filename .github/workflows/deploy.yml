name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Production component to deploy"
        required: false
        default: public
        type: choice
        options:
          - public
          - admin
      access_allowed_emails:
        description: "Comma-separated email allowlist for Cloudflare Access"
        required: false
        default: ""
        type: string
      access_allowed_domains:
        description: "Comma-separated email-domain allowlist for Cloudflare Access"
        required: false
        default: ""
        type: string
      access_allowed_github_orgs:
        description: "Comma-separated GitHub organization allowlist for Cloudflare Access"
        required: false
        default: "openclaw"
        type: string
      access_allowed_github_teams:
        description: "Comma-separated GitHub team allowlist; use team when one org is set, otherwise org/team"
        required: false
        default: ""
        type: string
      access_github_idp_id:
        description: "Optional Cloudflare Access GitHub identity-provider id"
        required: false
        default: ""
        type: string
      access_github_idp_name:
        description: "Cloudflare Access GitHub identity-provider name used for discovery"
        required: false
        default: "GitHub"
        type: string
      access_service_token_ids:
        description: "Comma-separated Access service-token ids for CLI automation"
        required: false
        default: ""
        type: string
      access_revoke_service_tokens:
        description: "Revoke the existing automation service-token policy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy-public:
    if: ${{ github.ref == 'refs/heads/main' && inputs.target == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Apply D1 migrations and deploy public Worker
        run: pnpm deploy:public
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    if: ${{ github.ref == 'refs/heads/main' && inputs.target == 'admin' }}
    runs-on: ubuntu-24.04
    environment: krillswitch-admin
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Verify production build
        run: pnpm --dir apps/admin build

      - name: Provision Cloudflare Access
        run: pnpm cf:access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KRILLSWITCH_ACCESS_APP_ID: ${{ vars.KRILLSWITCH_ACCESS_APP_ID }}
          KRILLSWITCH_ACCESS_ALLOWED_EMAILS: ${{ inputs.access_allowed_emails }}
          KRILLSWITCH_ACCESS_ALLOWED_DOMAINS: ${{ inputs.access_allowed_domains }}
          KRILLSWITCH_ACCESS_GITHUB_ORGS: ${{ inputs.access_allowed_github_orgs || 'openclaw' }}
          KRILLSWITCH_ACCESS_GITHUB_TEAMS: ${{ inputs.access_allowed_github_teams }}
          KRILLSWITCH_ACCESS_GITHUB_IDP_ID: ${{ inputs.access_github_idp_id }}
          KRILLSWITCH_ACCESS_GITHUB_IDP_NAME: ${{ inputs.access_github_idp_name || 'GitHub' }}
          KRILLSWITCH_ACCESS_SERVICE_TOKEN_IDS: ${{ inputs.access_service_token_ids }}
          KRILLSWITCH_ACCESS_REVOKE_SERVICE_TOKENS: ${{ inputs.access_revoke_service_tokens && '1' || '0' }}

      - name: Apply D1 migrations and deploy Worker
        run: pnpm --dir apps/api db:migrate:remote && pnpm --dir apps/api deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
